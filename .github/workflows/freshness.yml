name: Pin Freshness

# ITS OWN WORKFLOW, SO THE BADGE MEANS WHAT A READER THINKS IT MEANS.
#
# This job used to run inside Deployment Verification, whose badge is the one
# on the README and in the catalogue. It is a designed alarm: it goes red when
# a pin falls behind upstream, and the fleet's triage moves the pin within the
# day. Measured across the fleet over fourteen days, nine red runs in ten were
# this alarm and nothing else, and a visitor cannot tell "one version behind"
# from "does not boot". The job below is unchanged; only its address moved.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily: rebuild to catch base-image and dependency drift, and check
    # that the compose pin still points at the published image.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: pin-freshness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-pin-freshness:
    name: Check the compose pin against the published image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the pinned digest against what the pinned tag resolves to now
        run: |
          pin="$(grep -m1 -oE '\$\{QUAKE3_SERVER_IMAGE_TAG:-.*' quake3-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"; pinned="${pin##*@}"
          # Three attempts: an unanswered registry lookup used to leave this empty,
          # and the comparison below then reported it as drift.
          now=""
          for attempt in 1 2 3; do
            now="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
            [ -n "$now" ] && break
            sleep $(( attempt * 5 ))
          done
          if [ -z "$now" ]; then
            echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
            exit 1
          fi
          if [ "$now" != "$pinned" ]; then
            echo "$ref now resolves to $now, the compose file pins $pinned" >&2
            exit 1
          fi
          echo "QUAKE3_SERVER_IMAGE_TAG OK (${ref})"

      - name: Compare the pin against the latest published build
        run: |
          pin="$(grep -m1 -oE '\$\{QUAKE3_SERVER_IMAGE_TAG:-.*' quake3-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          pinned="${pin##*@}"
          # Three attempts: an unanswered registry lookup used to leave this empty,
          # and the comparison below then reported it as drift.
          latest=""
          for attempt in 1 2 3; do
            latest="$(docker buildx imagetools inspect heyvaldemar/quake3-server:latest --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
            [ -n "$latest" ] && break
            sleep $(( attempt * 5 ))
          done
          if [ -z "$latest" ]; then
            echo "::error::heyvaldemar/quake3-server:latest did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
            exit 1
          fi
          if [ "$latest" != "$pinned" ]; then
            echo "heyvaldemar/quake3-server:latest is $latest but the compose file pins $pinned." >&2
            echo "The publish workflow commits the new pin after every build; check its last run." >&2
            exit 1
          fi
          echo "compose pin matches the latest published build"
