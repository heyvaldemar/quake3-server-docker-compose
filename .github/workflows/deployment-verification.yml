name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily: rebuild to catch base-image and dependency drift, and check
    # that the compose pin still points at the published image.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts, Dockerfile, and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh

      - name: hadolint (Dockerfile linting)
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" \
            hadolint/hadolint < Dockerfile

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  build-and-test:
    name: Build the image + QuakeJS web smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    env:
      DOCKER_COMPOSE_FILE: quake3-server-docker-compose.yml
      COMPOSE_PROJECT_NAME: quake3-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the server image from this checkout
        # The compose file normally pulls the published image; CI builds
        # the Dockerfile as-is so every push proves the image still
        # builds and boots before the publish workflow ships it.
        run: docker build -t heyvaldemar/quake3-server:ci .

      - name: Trivy scan of the freshly built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: heyvaldemar/quake3-server:ci
          format: sarif
          output: trivy-quake3-server.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-quake3-server.sarif
          category: trivy-quake3-server

      - name: Generate test .env with an ephemeral RCON password
        run: |
          cat > .env <<EOF
          QUAKE3_SERVER_IMAGE_TAG=heyvaldemar/quake3-server:ci
          QUAKE3_SERVER_IP_OR_HOSTNAME=127.0.0.1
          RCON_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Upgrade drill — the previous release comes up first, on the volumes this run will upgrade
        # A fresh stack proves the new image starts. It proves nothing about the
        # data a deployed host already has: whether the new database image accepts
        # the old data directory, whether the application's migrations run on a
        # populated schema. So the previous release is started first, on this
        # project's volumes, and the ordinary `up -d` below then recreates the
        # changed containers on top of it - which is exactly what `git pull &&
        # docker compose up -d` does on a deployed host. Every smoke check that
        # follows judges the upgraded stack, not a fresh one.
        run: |
          prev="$(git ls-remote --tags --sort=-v:refname origin 'v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
          if [ -z "$prev" ]; then
            echo "no previous release: nothing to upgrade from, the fresh start below is the whole test"
            exit 0
          fi
          git fetch --depth=1 --quiet origin "refs/tags/$prev:refs/tags/$prev"
          if git diff --quiet "$prev" -- "$DOCKER_COMPOSE_FILE"; then
            echo "the compose file is unchanged since $prev: nothing to drill"
            exit 0
          fi
          git show "$prev:$DOCKER_COMPOSE_FILE" > .upgrade-drill-previous.yml
          echo "starting $prev on this project's volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" up -d
          # Healthy means: every container is running and healthy (or running
          # with no health check), or exited 0 (a one-shot init container).
          bad=""
          for _ in $(seq 1 60); do
            bad="$(docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" ps -a --format json \
              | jq -rs '[.[] | select((.State == "running" and (.Health == "" or .Health == "healthy")) or (.State == "exited" and .ExitCode == 0) | not)] | map("\(.Service):\(.State)/\(.Health)") | join(" ")')"
            [ -z "$bad" ] && break
            sleep 10
          done
          if [ -n "$bad" ]; then
            echo "::error::the previous release ($prev) did not come up with this run's .env: $bad. Either the variable contract changed - then the changelog must say so - or $prev was never green here."
            docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" logs --tail 80
            exit 1
          fi
          echo "$prev is up and healthy; stopping it and keeping its volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" down
          rm -f .upgrade-drill-previous.yml
          echo "the start below is now an upgrade from $prev"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Every volume an image declares is one this stack names
        # A VOLUME the image declares and no mount covers becomes an anonymous
        # volume: it holds data, the backups never see it, and a down/up gives
        # the container an empty one. GLPI's data lived in one for six weeks in
        # 2026, under a named volume mounted where the image never reads.
        # Anonymous volumes this stack keeps on purpose are listed, with the
        # reason, in .github/anonymous-volumes as "service /path reason".
        run: |
          allowed="$(grep -vE '^[[:space:]]*(#|$)' .github/anonymous-volumes 2>/dev/null | awk '{print $1" "$2}' || true)"
          bad=""
          for c in $(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"); do
            svc="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$c")"
            for m in $(docker inspect -f '{{range .Mounts}}{{if eq .Type "volume"}}{{.Name}}={{.Destination}} {{end}}{{end}}' "$c"); do
              [[ "${m%%=*}" =~ ^[0-9a-f]{64}$ ]] || continue
              grep -qxF "$svc ${m#*=}" <<<"$allowed" || bad="$bad $svc:${m#*=}"
            done
          done
          if [ -n "$bad" ]; then
            echo "::error::anonymous volumes no named volume covers:$bad. Mount a named volume there, or list it in .github/anonymous-volumes with the reason."
            exit 1
          fi
          echo "every volume the images declare is named, or listed as anonymous on purpose"

      - name: Wait for the QuakeJS web client to answer
        run: |
          # shellcheck disable=SC2016
          timeout 5m bash -c 'while ! curl -fs -o /dev/null -w "%{http_code}" http://127.0.0.1/ | grep -q 200; do
            echo "Waiting for the web client..."
            sleep 5
          done'
          curl -fs -o /dev/null -w "QuakeJS web client: %{http_code}\n" http://127.0.0.1/

      - name: Verify the game port is listening
        run: |
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs | tail -20
          (echo > /dev/udp/127.0.0.1/27960) && echo "UDP 27960 reachable"

      - name: RCON_PASSWORD is the one the server uses, and on no command line
        # From v1.3.0 to v1.6.0 the tracked server.cfg carried a literal
        # password where the placeholder belonged, so RCON_PASSWORD was ignored
        # and every deployment ran with the one in git; nothing here noticed.
        # Now: the config the server reads must carry RCON_PASSWORD, the
        # checkout's server.cfg must still carry the placeholder after a start,
        # and no command line on the runner or in the container may hold the
        # value. Compared through files, so the password is never printed.
        run: |
          pw="$(mktemp)"; expect="$(mktemp)"; chmod 600 "$pw" "$expect"
          sed -n 's/^RCON_PASSWORD=//p' .env > "$pw"
          [ -s "$pw" ] || { echo "::error::no RCON_PASSWORD in .env"; exit 1; }
          printf 'seta rconpassword "%s"\n' "$(cat "$pw")" > "$expect"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T quake3-server cat /quakejs/base/baseq3/server.cfg \
            | grep -qxF -f "$expect" || { echo "::error::the server's config does not carry RCON_PASSWORD"; exit 1; }
          git diff --quiet -- server.cfg || { echo "::error::the checkout's server.cfg was rewritten by the container"; exit 1; }
          grep -q '%RCON_PASSWORD%' server.cfg || { echo "::error::server.cfg has lost its placeholder"; exit 1; }
          # shellcheck disable=SC2009  # every command line on the runner, not one process
          host=$(ps -eo args= | grep -cF -f "$pw" || true)
          # shellcheck disable=SC2016  # expanded by the container's shell
          ctr=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T quake3-server sh -c 'for f in /proc/[0-9]*/cmdline; do tr "\000" " " < "$f" 2>/dev/null; echo; done' | grep -cF -f "$pw" || true)
          rm -f "$pw" "$expect"
          echo "command lines carrying RCON_PASSWORD: $host on the runner, $ctr in the container"
          [ "$host" = 0 ] && [ "$ctr" = 0 ] || { echo "::error::RCON_PASSWORD is on a command line"; exit 1; }
          echo "the server's config carries RCON_PASSWORD; the checkout's server.cfg still carries the placeholder"

      - name: The game answers getstatus through the players' WebSocket
        # Healthy means the game loop answered Quake 3's out-of-band getstatus
        # with a statusResponse, sent through the WebSocket players use; a
        # handshake alone is not enough (see include/healthcheck.js).
        run: |
          cid="$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" ps -q quake3-server)"
          s=none
          for _ in $(seq 1 30); do
            s="$(docker inspect "$cid" --format '{{.State.Health.Status}}')"
            [ "$s" = healthy ] && break
            sleep 10
          done
          echo "docker health: $s"
          [ "$s" = healthy ] || { echo "::error::never healthy"; docker inspect "$cid" --format '{{json .State.Health.Log}}' | tail -c 600; exit 1; }
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T quake3-server node /healthcheck.js

      - name: rcon answers RCON_PASSWORD from .env, and refuses a wrong one
        # The control for the refusal below: through the players' WebSocket,
        # `rcon <RCON_PASSWORD> status` must come back with the status table and
        # a wrong password with "Bad rconpassword". The probe reads the password
        # from the container's own environment, so it is on no command line.
        run: |
          probe='const W=require("/quakejs/node_modules/ws");
          const ask=(p)=>new Promise((r)=>{const w=new W("ws://127.0.0.1:27960");const t=setTimeout(()=>{w.close();r("")},4000);
            w.on("open",()=>w.send(Buffer.concat([Buffer.from([255,255,255,255]),Buffer.from("rcon "+p+" status\n")])));
            w.on("message",(d)=>{clearTimeout(t);w.close();r(Buffer.from(d).toString("latin1",4))});w.on("error",()=>r(""))});
          (async()=>{const a=await ask(process.env.RCON_PASSWORD);await new Promise((r)=>setTimeout(r,1500));const b=await ask("wrong-"+Date.now());
            const ok=/^print\n/.test(a)&&/^map:/m.test(a);const no=/Bad rconpassword/.test(b);
            console.log("rcon with RCON_PASSWORD: "+(ok?"the status table":"no status table")+"; with a wrong password: "+(no?"refused":"NOT refused"));
            process.exit(ok&&no?0:1)})()'
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T quake3-server node -e "$probe"

      - name: On the scoreboard too - after the fraglimit, with the log silent, the game still answers
        # In QuakeJS (retail 1.32 game code) the intermission after the
        # fraglimit ends only when a human is ready, and bots never are: an
        # empty server stands on the scoreboard and its log goes quiet, while
        # it is perfectly well. A check that read the log would call it dead.
        # Fraglimit 1 with the shipped bots, wait for "Exit: Fraglimit hit",
        # require 90 seconds with no new log line, then the health check.
        run: |
          sed -E -e 's/^seta fraglimit .*/seta fraglimit 1/' -e 's/^seta timelimit .*/seta timelimit 0/' server.cfg > .ci-intermission.cfg
          printf '%s\n' 'services:' '  quake3-server:' '    volumes: !override' \
            '      - ./.ci-intermission.cfg:/quakejs/base/baseq3/server.cfg.template:ro' > .ci-intermission.yml
          C="docker compose -f $DOCKER_COMPOSE_FILE -f .ci-intermission.yml -p $COMPOSE_PROJECT_NAME"
          $C up -d --force-recreate
          cid="$($C ps -q quake3-server)"
          for _ in $(seq 1 60); do
            docker logs "$cid" 2>&1 | grep -q 'Exit: Fraglimit hit' && break
            sleep 10
          done
          docker logs "$cid" 2>&1 | grep -m1 'Exit: Fraglimit hit' || { echo "::error::the fraglimit was never hit"; docker logs --tail 40 "$cid"; exit 1; }
          n0="$(docker logs "$cid" 2>&1 | wc -l)"; sleep 90; n1="$(docker logs "$cid" 2>&1 | wc -l)"
          echo "log lines: $n0, then $n1 after 90 seconds on the scoreboard"
          [ "$n1" = "$n0" ] || { echo "::error::the log was not silent, so this did not test the silent scoreboard"; docker logs --since 90s "$cid" 2>&1 | tail -20; exit 1; }
          $C exec -T quake3-server node /healthcheck.js
          s="$(docker inspect "$cid" --format '{{.State.Health.Status}}')"
          echo "docker health on the silent scoreboard: $s"
          [ "$s" = healthy ] || { echo "::error::unhealthy on the scoreboard"; exit 1; }

      - name: Plant - a handshake is not a game - the image v1.6.1 shipped is unhealthy
        # Every release up to v1.6.1 answered the WebSocket handshake while the
        # engine dropped every packet a client sent (ws 8's message event). The
        # check up to v1.6.1 called it healthy; this one must not.
        run: |
          prev=heyvaldemar/quake3-server:860318374ed9083547e2149463891cd2b9a836d9@sha256:1cd966150675c5c013af7e84d5ae8628f33684ba8fd11f84304282a84115c3a1
          docker run -d --name q3-v161 -e RCON_PASSWORD="$(openssl rand -hex 16)" -e SERVER=127.0.0.1 \
            -v "$PWD/include/healthcheck.js:/new-healthcheck.js:ro" "$prev" >/dev/null
          old="const h=require('http').request({host:'127.0.0.1',port:27960,headers:{Connection:'Upgrade',Upgrade:'websocket','Sec-WebSocket-Version':'13','Sec-WebSocket-Key':'AAAAAAAAAAAAAAAAAAAAAA=='}});h.setTimeout(5000,()=>process.exit(1));h.on('upgrade',()=>process.exit(0));h.on('response',r=>process.exit(r.statusCode===101?0:1));h.on('error',()=>process.exit(1));h.end()"
          for _ in $(seq 1 30); do docker exec q3-v161 node -e "$old" && break; sleep 5; done
          sleep 30
          o=0; docker exec q3-v161 node -e "$old" || o=$?
          n=0; docker exec q3-v161 node /new-healthcheck.js || n=$?
          docker rm -f q3-v161 >/dev/null
          echo "v1.6.1's image: the old check exits $o, the new one exits $n"
          [ "$o" = 0 ] && [ "$n" = 1 ] || { echo "::error::expected the old check to pass (0) and the new to fail (1)"; exit 1; }

      - name: Plant - the password v1.6.0 published is refused at start, and so is an old compose file
        # v1.3.0 to v1.6.0 shipped a literal rconpassword in server.cfg. With
        # v1.6.2's working WebSocket, a server.cfg kept from those releases
        # would hand rcon to anyone, so the entrypoint now refuses to start on
        # it, by its SHA-256. Three plants, each must stop the container with
        # the entrypoint's ERROR: v1.6.0's server.cfg as the template; the same
        # value as RCON_PASSWORD; and v1.6.0's own compose file, which mounts
        # server.cfg itself and used to restart forever on "resource busy".
        # The value is read from git into a 600 file and only ever counted:
        # no log line here may carry it.
        run: |
          git fetch --depth=1 --quiet origin refs/tags/v1.6.0:refs/tags/v1.6.0
          umask 077
          git show v1.6.0:server.cfg > .ci-published.cfg
          pw="$(mktemp)"
          sed -nE 's/^seta rconpassword "([^"]*)".*/\1/p' .ci-published.cfg > "$pw"
          [ -s "$pw" ] || { echo "::error::v1.6.0's server.cfg sets no rconpassword; the plant would prove nothing"; exit 1; }
          awk -v f="$pw" 'BEGIN { getline p < f } /^RCON_PASSWORD=/ { print "RCON_PASSWORD=" p; next } { print }' .env > .ci-published.env
          umask 022
          printf '%s\n' 'services:' '  quake3-server:' '    volumes: !override' \
            '      - ./.ci-published.cfg:/quakejs/base/baseq3/server.cfg.template:ro' > .ci-published.yml
          git show v1.6.0:"$DOCKER_COMPOSE_FILE" > .ci-v160.yml
          refused() {  # what: expected ERROR text, then the compose arguments
            local what=$1 expect=$2; shift 2
            docker compose "$@" -p "$COMPOSE_PROJECT_NAME" up -d --force-recreate quake3-server >/dev/null 2>&1
            local cid; cid="$(docker compose "$@" -p "$COMPOSE_PROJECT_NAME" ps -aq quake3-server)"
            sleep 20
            local logs; logs="$(docker logs "$cid" 2>&1)"
            local leak; leak="$(grep -cF -f "$pw" <<<"$logs" || true)"
            local st; st="$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$cid")"
            local err; err="$(grep -m1 '^ERROR' <<<"$logs" || true)"
            echo "$what: state $st; ${err:-no ERROR line}; log lines carrying the value: $leak"
            [ "$leak" = 0 ] || { echo "::error::$what: the log carries the value"; return 1; }
            [[ $err == *"$expect"* ]] || { echo "::error::$what: started, or stopped without the expected error"; return 1; }
            [[ $st != running* ]] || { echo "::error::$what: still running"; return 1; }
          }
          rc=0
          refused "v1.6.0's server.cfg" "rconpassword this repository once published" \
            -f "$DOCKER_COMPOSE_FILE" -f .ci-published.yml || rc=1
          refused "RCON_PASSWORD set to it" "rconpassword this repository once published" \
            --env-file .ci-published.env -f "$DOCKER_COMPOSE_FILE" || rc=1
          refused "v1.6.0's compose file" "is mounted from the host" \
            -f .ci-v160.yml || rc=1
          docker compose -f .ci-v160.yml -p "$COMPOSE_PROJECT_NAME" down >/dev/null 2>&1 || true
          rm -f "$pw" .ci-published.cfg .ci-published.env .ci-published.yml .ci-v160.yml
          exit "$rc"

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down

