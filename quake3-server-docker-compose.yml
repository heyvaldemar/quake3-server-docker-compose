# Image pin lives HERE, as an interpolation default, so `git pull` (or
# re-downloading this file) delivers the exact image this repository has
# tested. The image is built from this repository's Dockerfile by the
# "Publish Docker Image to Registry" workflow, tagged with the commit it
# was built from, and pinned here by digest; that workflow commits the
# new pin after every publish. Set QUAKE3_SERVER_IMAGE_TAG in .env to
# run a different build (for example one you built yourself).
# CI (the Trivy scan, check-pin-freshness, the deploy job) reads the pin
# from this line: this block is the single source of truth.
x-images:
  quake3-server: &quake3-server-image ${QUAKE3_SERVER_IMAGE_TAG:-heyvaldemar/quake3-server:${QUAKE3_SERVER_IMAGE_VERSION:-d44caf2a0d97109e7c0f60a08d864b8f1eb70895@sha256:5a2530fe8c2f36430453b8efc9a86ad6242a39b2b7daba3e81d2a26f467e3a09}}

services:
  quake3-server:
    image: *quake3-server-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # This container runs TWO processes: node serves the game on 27960, and a
    # separate apache2 serves the browser client on :80. That matters, because
    # the obvious check is a false green. Measured, with node stopped from the
    # host: a GET on :80 still returns 200, because apache2 is untouched, and a
    # bare TCP connect to 27960 still succeeds, because the kernel accepts into
    # the listen backlog of a stopped process. Both report a healthy container
    # with a dead game.
    #
    # QuakeJS speaks WebSocket, so the check completes a handshake and requires
    # 101 Switching Protocols - which only node can answer. Verified in both
    # directions: exit 0 while the game is up, exit 1 with node stopped.
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http').request({host:'127.0.0.1',port:27960,headers:{Connection:'Upgrade',Upgrade:'websocket','Sec-WebSocket-Version':'13','Sec-WebSocket-Key':'AAAAAAAAAAAAAAAAAAAAAA=='}});h.setTimeout(5000,()=>process.exit(1));h.on('upgrade',()=>process.exit(0));h.on('response',r=>process.exit(r.statusCode===101?0:1));h.on('error',()=>process.exit(1));h.end()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Resource limits as .env-overridable defaults (e.g. QUAKE3_SERVER_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    #
    # 512m is deliberate and measured, not a guess, and it is worth knowing why
    # before raising it. Given no limit this server settles around 840 MB with
    # bots playing; held to 512m it runs at 470-490 MB and is not OOM-killed,
    # because the engine sizes its heap to the cgroup it finds itself in. The
    # number here therefore looks alarming next to an unconstrained measurement
    # and is not. Raise it if `docker inspect <container> --format
    # '{{.State.OOMKilled}}'` actually says true.
    deploy:
      resources:
        limits:
          memory: ${QUAKE3_SERVER_MEMORY_LIMIT:-512m}
          cpus: "${QUAKE3_SERVER_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${QUAKE3_SERVER_MEMORY_RESERVATION:-64m}
          cpus: "${QUAKE3_SERVER_CPU_RESERVATION:-0.25}"
    volumes:
      - ./server.cfg:/quakejs/base/baseq3/server.cfg
    environment:
      SERVER: ${QUAKE3_SERVER_IP_OR_HOSTNAME}
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD must be set in .env}
    ports:
      - "80:80"
      - "27960:27960"
    restart: unless-stopped
