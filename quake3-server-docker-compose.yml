# Image pin lives HERE, as an interpolation default, so `git pull` (or
# re-downloading this file) delivers the exact image this repository has
# tested. The image is built from this repository's Dockerfile by the
# "Publish Docker Image to Registry" workflow, tagged with the commit it
# was built from, and pinned here by digest; that workflow commits the
# new pin after every publish. Set QUAKE3_SERVER_IMAGE_TAG in .env to
# run a different build (for example one you built yourself).
# CI (the Trivy scan, check-pin-freshness, the deploy job) reads the pin
# from this line: this block is the single source of truth.
x-images:
  quake3-server: &quake3-server-image ${QUAKE3_SERVER_IMAGE_TAG:-heyvaldemar/quake3-server:${QUAKE3_SERVER_IMAGE_VERSION:-ee95ec512511b8744339473dfdf0adfd0cafc248@sha256:037a08c4a80995fef8a6cbd48e5a56f580856eb302972ae3c24d0b9b2f50202d}}

services:
  quake3-server:
    image: *quake3-server-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # This container runs TWO processes: node serves the game on 27960, and a
    # separate apache2 serves the browser client on :80. The obvious checks are
    # false greens. A GET on :80 returns 200 with the game dead, because apache2
    # is untouched; a bare TCP connect to 27960 succeeds into the listen backlog
    # of a stopped process. And a WebSocket handshake, the check up to v1.6.1,
    # is answered by the ws library before any game code runs: every release up
    # to v1.6.1 answered 101 while the server dropped every packet a client
    # sent, so nobody could join and this said healthy.
    #
    # So the check asks the game. /healthcheck.js (include/healthcheck.js, built
    # into the image) sends Quake 3's out-of-band getstatus through the same
    # WebSocket players use and is healthy only on a statusResponse, which only
    # a running game loop writes. Not the log: an empty server can stand on the
    # scoreboard after the fraglimit for hours and write nothing, because the
    # intermission waits for a human to be ready and bots never are. CI holds
    # the server there with a silent log and requires this to stay green, and
    # runs it against the image every earlier release shipped, which it calls
    # unhealthy.
    healthcheck:
      test: ["CMD", "node", "/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Resource limits as .env-overridable defaults (e.g. QUAKE3_SERVER_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    #
    # 512m is deliberate and measured, not a guess, and it is worth knowing why
    # before raising it. Given no limit this server settles around 840 MB with
    # bots playing; held to 512m it runs at 470-490 MB and is not OOM-killed,
    # because the engine sizes its heap to the cgroup it finds itself in. The
    # number here therefore looks alarming next to an unconstrained measurement
    # and is not. Raise it if `docker inspect <container> --format
    # '{{.State.OOMKilled}}'` actually says true.
    deploy:
      resources:
        limits:
          memory: ${QUAKE3_SERVER_MEMORY_LIMIT:-512m}
          cpus: "${QUAKE3_SERVER_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${QUAKE3_SERVER_MEMORY_RESERVATION:-64m}
          cpus: "${QUAKE3_SERVER_CPU_RESERVATION:-0.25}"
    volumes:
      # READ-ONLY, AND BESIDE THE FILE THE SERVER READS, NOT ON IT. Mounted onto
      # server.cfg itself, the entrypoint wrote the password into this
      # repository's tracked file at every start, and one such file was
      # committed on 2026-09-03: from v1.3.0 the placeholder was gone, the
      # password in .env was ignored, and every deployment ran with the one in
      # git. The entrypoint renders this template into the container instead.
      - ./server.cfg:/quakejs/base/baseq3/server.cfg.template:ro
    environment:
      # THE GAME GETS THE HOUSEHOLD CLOCK TOO, not only whatever sidecar
      # sits beside it. Every timestamp this server writes — bans, joins,
      # the crash it leaves behind — is read next to a log line from
      # somewhere else, and two clocks make that arithmetic. UTC by
      # default, which is a choice rather than an accident.
      TZ: ${QUAKE3_SERVER_TIMEZONE:-UTC}
      SERVER: ${QUAKE3_SERVER_IP_OR_HOSTNAME}
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD must be set in .env}
    ports:
      - "80:80"
      - "27960:27960"
    restart: unless-stopped
